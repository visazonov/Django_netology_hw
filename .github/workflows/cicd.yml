name: Test django

on:
  push:
    branches: [cicd]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "0"
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      DB_ENGINE: ${{ secrets.DB_ENGINE }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.DB_NAME }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Линтинг
        run: |
          flake8 logistic --exclude logistic/migrations
#          flake8 advertisements --exclude advertisements/migrations
#          flake8 api_measurement --exclude api_measurement/migrations
#          flake8 app --exclude app/migrations
#          flake8 articles --exclude articles/migrations
#          flake8 books --exclude books/migrations
#          flake8 calculator --exclude calculator/migrations
#          flake8 orm_catalog --exclude orm_catalog/migrations
#          flake8 phones --exclude phones/migrations
#          flake8 school --exclude school/migrations
#          flake8 stations --exclude stations/migrations
#          flake8 students --exclude students/migrations

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Run tests
        run: |
          python manage.py test

